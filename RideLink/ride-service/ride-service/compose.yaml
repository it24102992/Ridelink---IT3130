services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ride-mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-ride.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  ride-service:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      MONGODB_URI: mongodb://mongo:27017/ridelink_ride

volumes:
  ride-mongo-data:
